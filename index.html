  :root {
    --btn-bg: #fff;
    --btn-border: #ccc;
    --accent: #1432a0;

  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0.75rem;
    background: #f7f7f7;
    text-align: center;
    min-height: 100vh;

body {

}

  
  h1 {
    margin: 0.4rem 0 0.8rem;
    font-size: clamp(1.4rem, 5vw, 2rem);
  }
  .top-controls {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 0.8rem;
  }
  select, button {
    font-size: 1rem;
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--btn-border);
    border-radius: 8px;
    background: var(--btn-bg);
    cursor: pointer;
  }

  #canvas-wrap {
    width: min(92vw, 520px);
    margin: 0 auto;
  }
  canvas {
    width: 100%;
    height: auto;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    display: block;
  }
  #caption {
    font-size: clamp(1rem, 3.5vw, 1.15rem);
    margin: 0.5rem 0 0.8rem;
    font-weight: 500;
  }
  .roll-wrap {
    margin: 0.6rem 0 1.2rem;

  #rollBtn {
    font-size: clamp(2.2rem, 10vw, 3.2rem);
    padding: 0.4rem 1.4rem;
    border-radius: 16px;
    border: 2px solid var(--accent);
    background: #fff;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  #rollBtn:active {

  }
  @media (max-width: 480px) {

const COLORS = { r: "#c81e1e", w: "#ffffff", b: "#1432a0", y: "#ffe028" };

function parseFace(code) {
  if (typeof code !== "string") return { c1: "#ccc", c2: null, dir: null };
  if (code.includes("//")) {
    const [c1, c2] = code.split("//");
    return { c1: COLORS[c1] || "#ccc", c2: COLORS[c2] || "#ccc", dir: "//" };
  }
  if (code.includes("\\")) {
    const [c1, c2] = code.split("\\");
    return { c1: COLORS[c1] || "#ccc", c2: COLORS[c2] || "#ccc", dir: "\\" };
  }
  return { c1: COLORS[code] || "#ccc", c2: null, dir: null };
}

function drawFace(ctx, x, y, size, code) {
  const f = parseFace(code);
  if (!f.dir) {
    ctx.fillStyle = f.c1;
    ctx.fillRect(x, y, size, size);
    return;
  }
  if (f.dir === "\\") {
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y + size); ctx.lineTo(x + size, y + size); ctx.closePath();
    ctx.fillStyle = f.c1; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + size, y); ctx.lineTo(x + size, y + size); ctx.closePath();
    ctx.fillStyle = f.c2; ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.closePath();
    ctx.fillStyle = f.c1; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + size, y); ctx.lineTo(x + size, y + size); ctx.lineTo(x, y + size); ctx.closePath();
    ctx.fillStyle = f.c2; ctx.fill();
  }
}

function renderPattern(design) {
  const rows = design.slice(1);
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const n = rows.length;
  const m = Math.max(...rows.map(r => r.length), 1);
  const pad = 20;
  const cell = Math.floor((Math.min(canvas.width, canvas.height) - pad * 2) / Math.max(n, m));
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const ox = (canvas.width - m * cell) / 2;
  const oy = (canvas.height - n * cell) / 2;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < rows[i].length; j++) {
      drawFace(ctx, ox + j * cell, oy + i * cell, cell, rows[i][j]);
    }
  }
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 3;
  ctx.strokeRect(ox - 2, oy - 2, m * cell + 4, n * cell + 4);
}

// ---------- Bell ding ----------
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function bellDing(freq = 880) {
  const ctx = getAudio();
  const now = ctx.currentTime;
  const dur = 1.4;
  const o1 = ctx.createOscillator();
  const g1 = ctx.createGain();
  o1.type = "sine";
  o1.frequency.value = freq;
  g1.gain.setValueAtTime(0.0, now);
  g1.gain.linearRampToValueAtTime(0.35, now + 0.01);
  g1.gain.exponentialRampToValueAtTime(0.001, now + dur);
  o1.connect(g1);
  g1.connect(ctx.destination);
  o1.start(now);
  o1.stop(now + dur);
  const o2 = ctx.createOscillator();
  const g2 = ctx.createGain();
  o2.type = "sine";
  o2.frequency.value = freq * 2.01;
  g2.gain.setValueAtTime(0.0, now);
  g2.gain.linearRampToValueAtTime(0.12, now + 0.008);
  g2.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.7);
  o2.connect(g2);
  g2.connect(ctx.destination);
  o2.start(now);
  o2.stop(now + dur);
}

// ---------- State ----------
let currentLevel = 0;
let currentIndex = 0;

function getDesigns() {
  return LIBRARY[currentLevel].slice(1);
}
function showCurrent() {
  const designs = getDesigns();
  if (!designs.length) return;
  currentIndex = ((currentIndex % designs.length) + designs.length) % designs.length;
  renderPattern(designs[currentIndex]);
  document.getElementById("caption").textContent =
    `Diagram ${currentIndex + 1} of ${designs.length}`;
}

// ---------- UI ----------
const setSelect = document.getElementById("setSelect");
LIBRARY.forEach((group, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = group[0];
  setSelect.appendChild(opt);
});

setSelect.onchange = () => {
  currentLevel = +setSelect.value;
  currentIndex = 0;
  showCurrent();
};

document.getElementById("backBtn").onclick = () => {
  bellDing(523);
  currentIndex--;
  showCurrent();
};
document.getElementById("rollBtn").onclick = () => {
  bellDing(659);
  const designs = getDesigns();
  if (!designs.length) return;
  currentIndex = Math.floor(Math.random() * designs.length);
  showCurrent();
};
document.getElementById("nextBtn").onclick = () => {
  bellDing(784);
  currentIndex++;
  showCurrent();
};

showCurrent();

<script>
// Swipe anywhere on the page:
// Swipe Left  = Next
// Swipe Right = Back

let startX = 0;
let startY = 0;
let endX = 0;
let endY = 0;

const SWIPE_THRESHOLD = 60;

document.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
    endX = e.changedTouches[0].clientX;
    endY = e.changedTouches[0].clientY;

    const dx = endX - startX;
    const dy = endY - startY;

    // Ignore short swipes
    if (Math.abs(dx) < SWIPE_THRESHOLD) return;

    // Ignore mostly vertical movement
    if (Math.abs(dy) > Math.abs(dx)) return;

    if (dx > 0) {
        // Swipe Right -> Back
        document.getElementById('backBtn').click();
    } else {
        // Swipe Left -> Next
        document.getElementById('nextBtn').click();
    }
}, { passive: true });
</script>
